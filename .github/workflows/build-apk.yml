```yaml
name: Compilar APK Renova tu mente sin conexión

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: unzip -oq renova_tu_mente_offline_biblia.zip

      - name: Generar Biblia local completa
        run: |
          cd renova
          python3 tools/prepare_bible.py
          test -s app/src/main/assets/bible-data.js
          grep -q 'window.RTM_BIBLE=' app/src/main/assets/bible-data.js
          echo "Archivo bíblico generado correctamente."
          ls -lh app/src/main/assets/bible-data.js

      - name: Compilar APK
        run: |
          cd renova
          gradle assembleDebug

      - name: Verificar que la APK contiene la Biblia
        run: |
          cd renova
          python3 - <<'PY'
          import glob, zipfile, sys
          apks = glob.glob("app/build/outputs/apk/debug/*.apk")
          if not apks:
              sys.exit("ERROR: no se generó la APK")
          with zipfile.ZipFile(apks[0]) as apk:
              names = apk.namelist()
              matches = [n for n in names if n.endswith("assets/bible-data.js")]
              if not matches:
                  sys.exit("ERROR: la APK no contiene bible-data.js")
              data = apk.read(matches[0])
              if b"window.RTM_BIBLE=" not in data or len(data) < 100000:
                  sys.exit("ERROR: el archivo bíblico está vacío o incompleto")
              print("Correcto: la APK contiene el recurso bíblico local.")
          PY

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Renova-tu-mente-APK-sin-conexion
          path: renova/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
```
