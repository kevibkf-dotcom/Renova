```yaml
name: Compilar APK Renova tu mente sin conexion

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: unzip -oq renova_tu_mente_offline_biblia.zip

      - name: Generar Biblia local
        run: |
          cd renova
          python3 tools/prepare_bible.py
          test -s app/src/main/assets/bible-data.js
          grep -q 'window.RTM_BIBLE=' app/src/main/assets/bible-data.js
          echo "Archivo biblico generado."

      - name: Compilar APK
        run: |
          cd renova
          gradle assembleDebug

      - name: Verificar APK
        run: |
          python3 -c "import glob,zipfile,sys; f=glob.glob('renova/app/build/outputs/apk/debug/*.apk'); sys.exit('No se genero la APK') if not f else None; z=zipfile.ZipFile(f[0]); n=[x for x in z.namelist() if x.endswith('assets/bible-data.js')]; sys.exit('La APK no contiene la Biblia local') if not n else print('La APK contiene bible-data.js')"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Renova-tu-mente-APK-sin-conexion
          path: renova/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
```
